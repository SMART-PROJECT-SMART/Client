<div class="toolbar-row">
  <div class="selected-chips">
    @if (showParameterSearch) {
      <mat-form-field appearance="outline" class="param-search-field" subscriptSizing="dynamic">
        <mat-icon matPrefix>search</mat-icon>
        <input
          matInput
          #paramSearchInput
          [value]="parameterSearch"
          (input)="onParameterSearchInput($event)"
          [matAutocomplete]="paramAuto"
          [placeholder]="investigationUi.PARAMETER_SEARCH_PLACEHOLDER"
        />
        <mat-autocomplete
          #paramAuto="matAutocomplete"
          (optionSelected)="onParameterSelected($event, paramSearchInput)"
        >
          @for (field of filteredUnselectedFields; track field) {
            <mat-option [value]="field">{{ getFieldLabel(field) }}</mat-option>
          }
        </mat-autocomplete>
      </mat-form-field>
    }
    @for (field of selectedFields; track field) {
      <span class="selected-chip">
        {{ getFieldLabel(field) }}
        <mat-icon class="chip-remove" (click)="removeField.emit(field)">close</mat-icon>
      </span>
    }
  </div>
  @if (showTimeRangeControls) {
    <div class="time-range-controls">
      <button
        mat-stroked-button
        class="range-trigger"
        (click)="openRangePicker.emit()"
        [matTooltip]="investigationUi.TOOLTIP_TIME_RANGE"
      >
        <mat-icon>date_range</mat-icon>
        <span class="range-display">{{ rangeDisplay }}</span>
      </button>
      @if (isRangeModified) {
        <button
          mat-icon-button
          (click)="resetTimeRange.emit()"
          [matTooltip]="investigationUi.TOOLTIP_RESET_RANGE"
        >
          <mat-icon>restart_alt</mat-icon>
        </button>
      }
    </div>
  }
</div>
