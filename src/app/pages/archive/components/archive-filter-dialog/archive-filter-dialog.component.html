<h2 mat-dialog-title>Filter & Load</h2>
<mat-dialog-content>
  <div class="filter-section">
    <h3 class="section-label">Date</h3>
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="full-width">
      <mat-label>Load by date</mat-label>
      <input matInput [matDatepicker]="picker" [formControl]="dateControl" [max]="today" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </div>

  <div class="filter-section">
    <h3 class="section-label">Tail ID</h3>
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="full-width">
      <mat-label>Select UAVs</mat-label>
      <mat-select [formControl]="tailIdControl" multiple>
        @for (id of availableTailIds(); track id) {
          <mat-option [value]="id">Tail {{ id }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>

  <div class="filter-section">
    <h3 class="section-label">Mission Type</h3>
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="full-width">
      <mat-label>Select types</mat-label>
      <mat-select [formControl]="typeControl" multiple>
        @for (t of missionTypes; track t) {
          <mat-option [value]="t">{{ t }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>

  <div class="filter-section">
    <h3 class="section-label">Title</h3>
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="full-width">
      <mat-label>Add title keywords</mat-label>
      <mat-chip-grid #chipGrid>
        @for (title of titles(); track $index) {
          <mat-chip-row (removed)="removeTitle($index)">
            {{ title }}
            <button matChipRemove><mat-icon>cancel</mat-icon></button>
          </mat-chip-row>
        }
      </mat-chip-grid>
      <input matInput [matChipInputFor]="chipGrid" (matChipInputTokenEnd)="addTitle($event)" placeholder="Type and press Enter" />
    </mat-form-field>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-button (click)="clear()">Clear</button>
  <button mat-raised-button color="primary" (click)="apply()">Apply</button>
</mat-dialog-actions>
