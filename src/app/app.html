<div class="app-container">
  <mat-sidenav-container class="sidenav-container mat-drawer-transition">
    <mat-sidenav #sidenav mode="over" class="nav-drawer">
      <app-sidebar (navItemClicked)="closeMenu()"></app-sidebar>
    </mat-sidenav>
    <mat-sidenav-content class="sidenav-content">
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
  <button
    class="floating-menu-btn"
    type="button"
    (click)="toggleMenu()"
    aria-label="Toggle navigation"
  >
    <mat-icon>menu</mat-icon>
  </button>
</div>
