<div class="app-container">
  <mat-sidenav-container class="sidenav-container mat-drawer-transition">
    <mat-sidenav #sidenav mode="over" class="nav-drawer">
      <app-sidebar (navItemClicked)="sidenav.close()"></app-sidebar>
    </mat-sidenav>
    <mat-sidenav-content class="sidenav-content">
      <button
        class="floating-menu-btn"
        type="button"
        (click)="sidenav.toggle()"
        aria-label="Toggle navigation"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
